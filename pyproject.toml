[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-rack-editor"
version = "0.10.1"
description = "Visual port placement and in-rack cabling for NetBox"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["netbox_rack_editor*"]

[tool.setuptools.package-data]
netbox_rack_editor = ["templates/netbox_rack_editor/*.html", "static/netbox_rack_editor/*.css", "static/netbox_rack_editor/*.js"]
