[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbCableEditor"
version = "0.10.64"
description = "nbCableEditor adds visual port placement and in-rack cabling to NetBox."
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["nbcableeditor*"]

[tool.setuptools.package-data]
nbcableeditor = ["templates/nbcableeditor/*.html", "static/nbcableeditor/*.css", "static/nbcableeditor/*.js", "static/nbcableeditor/layout-templates/*.json"]
